stages:
  Data_Collection:
    cmd: python src/DataCollection.py
    deps:
    - src/DataCollection.py
    outs:
    - data/raw
  Data_Preprocessing:
    cmd: python src/DataPreprocessing.py
    deps:
    - src/DataCollection.py
    outs:
    - data/processed
  Model_Building:
    cmd: python src/ModelBuilding.py
    deps:
    - src/DataPreprocessing.py
    outs:
    - data/model.pkl

  Model_Evaluation:
    cmd: python src/Metrics.py
    deps:
    - src/ModelBuilding.py
    metrics:
    - data/metrics.json:
        cache: false
